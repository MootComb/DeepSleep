name: Android Debug Build

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Fix gradle.properties
      run: |
        if [ -f gradle.properties ]; then
          sed -i 's/-XX:MaxPermSize=[0-9]*m//g' gradle.properties
          sed -i 's/org.gradle.jvmargs=-Xmx.*/org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError/' gradle.properties
        else
          echo "org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError" > gradle.properties
        fi
        echo "org.gradle.daemon=false" >> gradle.properties
        echo "org.gradle.parallel=true" >> gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "kotlin.code.style=official" >> gradle.properties

    - name: Fix app/build.gradle
      run: |
        if [ -f app/build.gradle ]; then
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle
        fi

    - name: Remove broken French resources
      run: |
        if [ -d app/src/main/res/values-fr ]; then
          rm -rf app/src/main/res/values-fr
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: |
        ./gradlew clean assembleDebug --no-daemon

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: DeepSleep-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Get APK info
      id: apk_info
      run: |
        APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
        if [ -n "$APK_PATH" ]; then
          APK_NAME=$(basename "$APK_PATH")
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK found: $APK_NAME"
        else
          echo "No APK found"
          exit 1
        fi

    - name: Upload to Release (if tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ steps.apk_info.outputs.apk_path }}
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
